name: CI

# 1. lint      — ruff (Python) + clang-format (C++)
# 2. native    — сборка C++ ядра с -Wall -Wextra, ctest, на Linux и Windows
# 3. tests     — полный pytest: C++ ядро + Python fallback, реальный PostgreSQL
#
# Прежняя версия запускала python3 test_simple.py из корня, хотя тесты
# уже были перенесены в tests/, — CI падал на первом же шаге.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror native/src/*.cpp native/include/scada/*.hpp native/tests/*.cpp

  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pybind11 cmake ninja
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scada
          POSTGRES_PASSWORD: scada_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCADA_TEST_PG: postgresql://scada:scada_ci_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build C++ core
        run: |
          cmake -S native -B build/native -G Ninja
          cmake --build build/native
      - name: Tests (C++ core)
        run: python -m pytest -q
      - name: Tests (pure Python fallback)
        run: SCADA_FORCE_PYTHON_CORE=1 python -m pytest -q
      - name: Demo smoke test
        run: |
          python run.py --demo --port 8000 > demo.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/meta && break; sleep 1; done
          curl -sf localhost:8000/api/snapshot | python -c "import json,sys; d=json.load(sys.stdin); assert d['tags']"
      - name: Demo log on failure
        if: failure()
        run: cat demo.log || true
